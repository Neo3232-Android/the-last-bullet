# Android APK build (game-ci / Unity 6.3 LTS)
#
# Builds The Last Bullet with Unity 6000.3.29f1 and uploads the APK.
# Runs on every push to main and on manual dispatch.
# License: uses the UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD repo secrets
# (see README.md — "Unity license activation" — before the first run).

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      # Free disk space: the Unity Android image is huge (~30 GB needed).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-android-6000.3.29f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-android-6000.3.29f1-

      # Run the EditMode tests first — a data/balance regression fails fast,
      # before the ~20 min APK build.
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          unityVersion: 6000.3.29f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.29f1
          targetPlatform: Android
          buildMethod: TheLastBullet.Editor.BuildScript.BuildAndroidApk
          versioning: None

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-last-bullet-apk
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 30
