# Unity license activation file request (one-time setup)
#
# Run this ONCE (Actions tab -> "Request Unity activation file" -> Run workflow)
# to get a .alf file. Then upload it at https://license.unity3d.com/manual,
# pick Unity Personal, download the .ulf license file, and paste its FULL
# CONTENTS into the UNITY_LICENSE repo secret (plus UNITY_EMAIL and
# UNITY_PASSWORD). After that, this workflow is never needed again.
# See README.md — "Unity license activation".

name: Request Unity activation file

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request .alf file
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.29f1

      - name: Upload .alf file
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ./*.alf
          if-no-files-found: error
          retention-days: 7
